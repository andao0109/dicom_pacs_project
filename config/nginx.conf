
server {
    listen 80;
    server_name localhost;

    location / {
        # Forward requests to Orthanc
        proxy_pass http://orthanc:8042;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # CORS configuration
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Requested-With, Prefer, Range" always;
        add_header Access-Control-Expose-Headers "Content-Location, Location, Content-Type, Content-Length, Content-Range" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
