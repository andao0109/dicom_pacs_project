

services:
  orthanc:
    image: orthancteam/orthanc:latest
    container_name: orthanc-pacs
    restart: unless-stopped
    ports:
      - "4242:4242"
      - "8042:8042"
    environment:
      ORTHANC__NAME: "DICOM PACS Server"
      ORTHANC__DICOM_AET: "ORTHANC"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      ORTHANC__DICOM_ALWAYS_ALLOW_MOVE: "true"
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__DICOM_MODALITIES: |
        {
          "remote": ["REMOTE", "host.docker.internal", 11112]
        }
    volumes:
      - ./data/orthanc:/var/lib/orthanc/db

  ohif:
    image: ohif/app:latest
    container_name: ohif-viewer
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./config/ohif-app-config.js:/usr/share/nginx/html/app-config.js:ro
    depends_on:
      - orthanc

  nginx:
    image: nginx:alpine
    container_name: dicom-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - orthanc

